# GitHub Pages 배포. 저장소 Settings → Pages → Source를 "GitHub Actions"로 켠 뒤에만 실제로 공개된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /DKCCC/
          SITE_URL: https://jaeminlim-max.github.io/DKCCC/
          # 간증문 서버(Apps Script 웹 앱) 주소. 공개 주소이므로 여기에 둔다 (암호는 Apps Script 스크립트 속성에만 있음).
          # 저장소 변수 GAS_URL이 있으면 그것을 먼저 쓴다.
          VITE_GAS_URL: ${{ vars.GAS_URL || 'https://script.google.com/macros/s/AKfycbxvOX16ZsrhVV_Mn_qfIWk05mR5cyD527L5jFXZj_dkhAkjfMn7GZnVd2_Mm8F5dSPa-Q/exec' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
